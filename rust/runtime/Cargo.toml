[package]
name = "ai-local-hub-runtime"
version = "0.4.5"
edition = "2021"
rust-version = "1.85"

[dependencies]
anyhow = "1"
async-trait = "0.1"
pi-edit = { path = "../vendor/omp/pi-edit" }
pi-ast = { path = "../vendor/omp/pi-ast" }
ast-grep-core = { version = "0.39", default-features = false, features = ["tree-sitter"] }
async-stream = "0.3"
dirs = "6"
percent-encoding = "2"
rand = "0.9"
sha2 = "0.10"
subtle = "2"
url = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
axum = { version = "0.8", features = ["http1", "json"] }
base64 = "0.22"
os_pipe = "1"
futures = "0.3"
globset = "0.4"
ignore = "0.4"
mime_guess = "2"
libc = "0.2"
regex = "1"
fancy-regex = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
rmcp = { version = "=3.5.1", features = ["server", "macros", "transport-streamable-http-server"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
uuid = { version = "1", features = ["v4"] }

[profile.release]
opt-level = "s"
lto = "thin"
strip = false
