name: desktop

# Native Rust MCP manager + worker; macOS Apple Silicon and Intel installers.
# Manual runs upload artifacts; a v* tag builds and attaches DMGs to a draft GitHub release.
# Publish the draft after checking both assets.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './rust/runtime -> target'
      - run: npm ci
      - run: npm run build
      - run: npm test

  bundle:
    needs: verify
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest # cross-compiled native Rust binaries for Intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './desktop/src-tauri -> target'

      - name: Build the manager, worker and web UI
        run: |
          npm ci
          npm run build

      - name: Stage native Rust manager, worker and React assets
        run: |
          npm --prefix desktop ci
          node scripts/stage-rust-desktop.mjs --target ${{ matrix.target }}

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Unsigned by default. To sign/notarize macOS releases, add:
          # APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
          # APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
        with:
          projectPath: desktop
          args: --target ${{ matrix.target }}
          # On a tag push this creates a draft release; manual runs only upload workflow artifacts.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('AI Local Hub {0}', github.ref_name) || '' }}
          releaseBody: 'macOS installers (Apple Silicon and Intel). These builds are unsigned; see the README for first-run instructions.'
          releaseDraft: true
          prerelease: false

      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: ai-local-hub-${{ matrix.target }}
          path: |
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
          if-no-files-found: warn
