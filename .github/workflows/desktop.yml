name: desktop

# For now, publish macOS Apple Silicon and Intel installers only.
# Manual runs upload artifacts; a v* tag builds and attaches DMGs to a draft GitHub release.
# Publish the draft after checking both assets.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      # The desktop app ships Bun, so the stdin-shutdown and attach behavior must hold there too.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Desktop-mode and bundle tests on Bun
        run: WTM_TEST_RUNTIME="$(which bun)" npx tsx --test tests/manager-desktop-mode.test.ts tests/bundle-smoke.test.ts

  bundle:
    needs: verify
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest # cross-compiled; the matching Bun runtime is staged by target
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './desktop/src-tauri -> target'

      - name: Build the manager, worker and web UI
        run: |
          npm ci
          npm run build

      - name: Stage the Bun runtime and app resources
        run: |
          npm --prefix desktop ci
          node scripts/stage-desktop.mjs --target ${{ matrix.target }} --skip-stale-check

      # Runs the staged Bun + bundled app exactly as the shell does. The x86_64 macOS build is
      # cross-compiled on an arm64 runner, so its runtime is not executed here.
      - name: Smoke test the embedded runtime
        if: matrix.target != 'x86_64-apple-darwin'
        run: node scripts/smoke-desktop-runtime.mjs --target ${{ matrix.target }}

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Unsigned by default. To sign/notarize macOS releases, add:
          # APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
          # APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
        with:
          projectPath: desktop
          args: --target ${{ matrix.target }}
          # On a tag push this creates a draft release; manual runs only upload workflow artifacts.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('AI Local Hub {0}', github.ref_name) || '' }}
          releaseBody: 'macOS installers (Apple Silicon and Intel). These builds are unsigned; see the README for first-run instructions.'
          releaseDraft: true
          prerelease: false

      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: ai-local-hub-${{ matrix.target }}
          path: |
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
          if-no-files-found: warn
