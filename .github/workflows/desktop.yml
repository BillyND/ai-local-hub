name: desktop

# Builds the desktop installers for macOS (arm64, x64), Windows (x64) and Linux (x64, arm64).
# Run it manually, or push a tag like v0.1.0 to also create a draft GitHub release.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      # The desktop app ships Bun, so the stdin-shutdown and attach behavior must hold there too.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Desktop-mode and bundle tests on Bun
        run: WTM_TEST_RUNTIME="$(which bun)" npx tsx --test tests/manager-desktop-mode.test.ts tests/bundle-smoke.test.ts

  bundle:
    needs: verify
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest # cross-compiled; the matching Bun runtime is staged by target
            target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: ubuntu-22.04-arm # only available in public repositories
            target: aarch64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Linux build dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf xdg-utils libxdo-dev libssl-dev

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './desktop/src-tauri -> target'

      - name: Build the manager, worker and web UI
        run: |
          npm ci
          npm run build

      - name: Stage the Bun runtime and app resources
        run: |
          npm --prefix desktop ci
          node scripts/stage-desktop.mjs --target ${{ matrix.target }} --skip-stale-check

      # Runs the staged Bun + bundled app exactly as the shell does. The x86_64 macOS build is
      # cross-compiled on an arm64 runner, so its runtime is not executed here.
      - name: Smoke test the embedded runtime
        if: matrix.target != 'x86_64-apple-darwin'
        run: node scripts/smoke-desktop-runtime.mjs --target ${{ matrix.target }}

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Unsigned by default. To sign, add the secrets below and Tauri picks them up:
          #   macOS:   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
          #            APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID (notarization)
          #   Windows: configure bundle.windows.signCommand or certificateThumbprint
        with:
          projectPath: desktop
          args: --target ${{ matrix.target }}
          # On a tag push this creates a draft release; manual runs only upload workflow artifacts.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('Workspace Tools {0}', github.ref_name) || '' }}
          releaseBody: 'Unsigned build. See the README for the first-run steps on macOS and Windows.'
          releaseDraft: true
          prerelease: false

      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: workspace-tools-${{ matrix.target }}
          path: |
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*-setup.exe
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.rpm
          if-no-files-found: warn
