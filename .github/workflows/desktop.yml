name: desktop

# Full tests run on branch pushes. A v* tag skips duplicate verification, builds the
# web UI once, then packages native installers in parallel on native OS runners.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    # Pull requests and main pushes get the full regression suite. Tag packaging
    # deliberately skips this duplicate work; tag only a commit already validated.
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './rust/runtime -> target'
      - run: npm ci --ignore-scripts
      - run: npm --prefix web ci
      - run: npm run build
      - run: npm test

  web-assets:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Build web assets once
        run: |
          npm ci --ignore-scripts
          npm --prefix web ci
          npm --prefix web run build
      - uses: actions/upload-artifact@v4
        with:
          name: ai-local-hub-web-assets
          path: dist/web
          if-no-files-found: error

  bundle:
    needs: web-assets
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-aarch64
            platform: macos-latest
            target: aarch64-apple-darwin
            artifact_glob: desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/**/*.dmg
          - name: macos-x64
            platform: macos-13
            target: x86_64-apple-darwin
            artifact_glob: desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/**/*.dmg
          - name: windows-x64
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_glob: |
              desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/**/*.msi
              desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/**/*.exe
          - name: linux-x64
            platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact_glob: |
              desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/**/*.AppImage
              desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/**/*.deb
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            curl \
            file \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            librsvg2-dev \
            patchelf

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            ./rust/runtime -> target
            ./desktop/src-tauri -> target

      - uses: actions/download-artifact@v4
        with:
          name: ai-local-hub-web-assets
          path: dist/web

      - name: Install desktop dependencies
        run: npm --prefix desktop ci --ignore-scripts
      - name: Stage native Rust manager, worker and React assets
        run: node scripts/stage-rust-desktop.mjs --target ${{ matrix.target }}
      - name: Build native installers
        run: node scripts/tauri-build.mjs build --target ${{ matrix.target }}
      - name: Check native bundle integrity
        run: node scripts/verify-desktop-build.mjs --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: ai-local-hub-installer-${{ matrix.name }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: bundle
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: ai-local-hub-installer-*
          merge-multiple: true
      - name: Create GitHub release and upload installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          assets=()
          while IFS= read -r -d '' file; do assets+=("$file"); done < <(find release-assets -type f -print0)
          gh release create "${GITHUB_REF_NAME}" "${assets[@]}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "AI Local Hub ${GITHUB_REF_NAME}" \
            --notes-file "docs/releases/${GITHUB_REF_NAME#v}.md" \
            --latest
